name: Simple build

on:
  push:
    branches:
      - "**"
      - "!master"
  pull_request:
    branches: [ "**", "!master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: make dependencies

    - name: Run Build GTK2
      run: make cqrlog_gtk2

    - name: Run Build QT5
      run: make cqrlog_qt5
