name: Build + AppImage Artifact for testing

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    tags-ignore:
      - '*'
  pull_request:
    branches: [ "master" ]
    tags-ignore:
      - '*'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Run Build Appimage QT5
      run: make appimage-qt5

    - name: Run Build test deb
      run: make deb

    - uses: actions/upload-artifact@v4
      with:
        name: AppImage
        path: |
          CQRLOG-*.AppImage
          cqrlog_*.deb
