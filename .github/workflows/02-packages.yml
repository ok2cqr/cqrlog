name: Build + AppImage Artifact for testing

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    tags-ignore:
      - '*'
  pull_request:
    branches: [ "master" ]
    tags-ignore:
      - '*'

jobs:
  appimage:
    # Oldest supported runner: the AppImage only runs on systems with
    # a glibc at least as new as the one it was built against
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Run Build Appimage QT5
      run: make appimage-qt5 QT6_DEPS=

    - uses: actions/upload-artifact@v4
      with:
        name: AppImage
        path: CQRLOG-*.AppImage

  deb:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: make dependencies

    - name: Run Build test deb
      run: make deb

    - uses: actions/upload-artifact@v4
      with:
        name: deb
        path: cqrlog_*.deb

  rpm:
    runs-on: ubuntu-latest
    container: fedora:44

    steps:
    # git must be there before checkout, or it falls back to a tarball without
    # .git and makerpm.sh (git ls-files) has nothing to package
    - name: Install Dependencies
      run: dnf -y install rpm-build dnf-plugins-core git make

    - uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: dnf -y builddep rpm/cqrlog.spec

    - name: Run Build test rpm
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        make rpm

    - uses: actions/upload-artifact@v4
      with:
        name: rpm
        path: cqrlog-*.rpm
