name: Draft Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    # Oldest supported runner: the AppImage only runs on systems with
    # a glibc at least as new as the one it was built against
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Run Build Appimage QT5
        run: make appimage-qt5 QT6_DEPS=

      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: CQRLOG-*-QT5-*.AppImage

  deb:
    runs-on: ubuntu-26.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: make dependencies

      - name: Run Build test deb
        run: make deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: cqrlog_*.deb

  build_release:
    name: build_release
    needs: [ appimage, deb ]
    runs-on: ubuntu-26.04

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: version
        run: echo "tag_ver=$(./tools/get_version.sh)" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Get latest changelog entries
        run: ./tools/changelog_latest.sh > CHANGELOG.latest

      - name: release-draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: CQRLOG v${{ env.tag_ver }}
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.latest
          files: |
            cqrlog_*.deb
            CQRLOG-*-QT5-*.AppImage
        env:
          GITHUB_TOKEN: ${{ github.token }}
